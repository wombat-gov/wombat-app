name: Build desktop app

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create a GitHub release for this tag (e.g. v1.0.0). Leave empty for a build-only run.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  WOMBAT_DASHBOARD_REPOSITORY: wombat-gov/wombat-dashboard
  WOMBAT_DASHBOARD_REF: ${{ vars.WOMBAT_DASHBOARD_REF || 'main' }}

jobs:
  checks:
    name: Static checks and unit tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Check out dashboard
        shell: bash
        run: |
          git clone --depth 1 --branch "$WOMBAT_DASHBOARD_REF" \
            "https://github.com/${WOMBAT_DASHBOARD_REPOSITORY}.git" ../wafpass-dashboard

      - name: Install electron app dependencies
        run: npm ci

      - name: Install dashboard dependencies
        working-directory: ../wafpass-dashboard
        run: npm ci

      - name: Build dashboard bundle
        run: npm run dashboard:build

      - name: Generate SBOM
        run: npm run sbom

      - name: Validate SBOM
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const overview = JSON.parse(fs.readFileSync('src/sbom.json', 'utf8'));
            const cdx = JSON.parse(fs.readFileSync('build/sbom.cdx.json', 'utf8'));
            if (!Array.isArray(overview.components) || overview.components.length === 0) {
              throw new Error('SBOM overview has no components');
            }
            if (cdx.bomFormat !== 'CycloneDX' || !Array.isArray(cdx.components) || cdx.components.length === 0) {
              throw new Error('CycloneDX SBOM is invalid or empty');
            }
            console.log('SBOM valid:', cdx.components.length, 'components');
          "

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: wombatpass-sbom
          path: |
            src/sbom.json
            build/sbom.cdx.json
          if-no-files-found: error
          retention-days: 90

      - name: i18n key parity
        run: npm run check:i18n

      - name: Scan store unit tests
        run: npm run test:scan-state

      - name: Syntax check shell modules
        shell: bash
        run: |
          for file in src/*.js src/*.cjs; do
            node --check "$file"
          done

  build:
    name: Build (${{ matrix.name }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
            package_script: package:mac
            artifact: wombatpass-macos
          - name: Windows
            os: windows-2022
            package_script: package:win
            artifact: wombatpass-windows
          - name: Linux
            os: ubuntu-22.04
            package_script: package:linux
            artifact: wombatpass-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot rpm

      - name: Check out dashboard
        shell: bash
        run: |
          git clone --depth 1 --branch "$WOMBAT_DASHBOARD_REF" \
            "https://github.com/${WOMBAT_DASHBOARD_REPOSITORY}.git" ../wafpass-dashboard

      - name: Install electron app dependencies
        run: npm ci

      - name: Install dashboard dependencies
        working-directory: ../wafpass-dashboard
        run: npm ci

      - name: Build and package
        run: npm run ${{ matrix.package_script }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-sbom
          path: |
            src/sbom.json
            build/sbom.cdx.json
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$INPUT_RELEASE_TAG"
          fi
          if [ -z "$tag" ]; then
            echo "::error::No release tag provided"
            exit 1
          fi
          version=$(jq -r .version package.json)
          if [ "v$version" != "$tag" ]; then
            echo "::error::Release tag $tag does not match package.json version $version"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download macOS installers
        uses: actions/download-artifact@v4
        with:
          name: wombatpass-macos
          path: release-files

      - name: Download Windows installers
        uses: actions/download-artifact@v4
        with:
          name: wombatpass-windows
          path: release-files

      - name: Download Linux installers
        uses: actions/download-artifact@v4
        with:
          name: wombatpass-linux
          path: release-files

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: wombatpass-sbom
          path: sbom

      - name: Prepare release assets
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          cp sbom/src/sbom.json "WOMBATpass-Dashboard-${VERSION}-sbom.json"
          cp sbom/build/sbom.cdx.json "WOMBATpass-Dashboard-${VERSION}-sbom.cdx.json"
          (
            cd release-files
            sha256sum *
            cd ..
            sha256sum "WOMBATpass-Dashboard-${VERSION}-sbom.json" \
              "WOMBATpass-Dashboard-${VERSION}-sbom.cdx.json"
          ) > SHA256SUMS.txt
          ls -lh release-files "WOMBATpass-Dashboard-${VERSION}-sbom.json" \
            "WOMBATpass-Dashboard-${VERSION}-sbom.cdx.json" SHA256SUMS.txt

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          prerelease=()
          case "$TAG" in
            *-*) prerelease=(--prerelease) ;;
          esac
          files=(
            release-files/*
            "WOMBATpass-Dashboard-${VERSION}-sbom.json"
            "WOMBATpass-Dashboard-${VERSION}-sbom.cdx.json"
            SHA256SUMS.txt
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" \
              --target "$GITHUB_SHA" \
              --title "WOMBATpass Dashboard ${VERSION}" \
              --generate-notes \
              "${prerelease[@]}"
          fi
